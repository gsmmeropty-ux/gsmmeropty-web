<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GsmmeroPTY</title>
<style>
  :root { --card:#151c27; --line:#2a3648; --txt:#e8eef6; --mut:#8ea0b5; --acc:#3d9cf0; --ok:#3ecf8e; --yt:#ff0000; --tg:#229ed9; --bn:#f3ba2f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","Noto Naskh Arabic",sans-serif; background:linear-gradient(165deg,#090d12,#152033 55%,#0b1016); color:var(--txt); }
  .wrap { max-width:820px; margin:0 auto; padding:22px 16px 48px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .langs { display:flex; gap:6px; flex-wrap:wrap; }
  .langs button { border:1px solid var(--line); background:#101820; color:var(--txt); border-radius:8px; padding:6px 8px; font-size:12px; cursor:pointer; }
  .langs button.on { background:var(--acc); color:#062033; border-color:var(--acc); font-weight:700; }
  .brand { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
  .logo { width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,#ff3b30,#ff8a3d); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; }
  h1 { font-size:22px; margin:0; }
  .sub { color:var(--mut); font-size:14px; margin:4px 0 0; }
  .social { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; }
  .social a { text-decoration:none; color:#fff; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:700; }
  .yt { background:var(--yt); } .tg { background:var(--tg); } .bn { background:var(--bn); color:#111; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  h2 { font-size:16px; margin:0 0 8px; }
  p, li { color:#c5d2e0; font-size:14px; line-height:1.55; }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 6px; }
  input, textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#101820; color:var(--txt); font-size:15px; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button.act, .btn { border:0; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .b1 { background:var(--acc); color:#062033; }
  .b3 { background:var(--ok); color:#062016; }
  .note { font-size:12px; color:var(--mut); line-height:1.6; }
  .ok { color:var(--ok); } .err { color:#ff8080; }
  .paybox { background:#101820; border:1px dashed #f3ba2f66; border-radius:10px; padding:12px; margin-top:8px; }
  .paybox b { color:var(--bn); }
  .foot { text-align:center; color:var(--mut); font-size:12px; margin-top:10px; line-height:1.6; }
  .foot a { color:#9fd4ff; text-decoration:none; }
  html[dir=rtl] .wrap { text-align:right; }
  html[dir=rtl] .top { flex-direction:row-reverse; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="note" id="langHint"></div>
    <div class="langs" id="langs"></div>
  </div>
  <div class="card">
    <div class="brand">
      <div class="logo">GSM</div>
      <div>
        <h1>GsmmeroPTY</h1>
        <p class="sub" id="t_sub"></p>
      </div>
    </div>
    <div class="social">
      <a class="yt" href="https://www.youtube.com/@GsmmeroPTY" target="_blank" rel="noopener">YouTube</a>
      <a class="tg" href="https://t.me/GsmmeroPTY" target="_blank" rel="noopener">Telegram</a>
      <a class="bn" href="https://t.me/GsmmeroPTY" target="_blank" rel="noopener">Binance Pay</a>
    </div>
  </div>
  <div class="card">
    <h2 id="t_files_h"></h2>
    <p id="t_files_p"></p>
    <p class="note" id="t_files_n"></p>
  </div>
  <div class="card">
    <h2 id="t_pay_h"></h2>
    <div class="paybox">
      <div id="t_pay_box"></div>
    </div>
  </div>
  <div class="card">
    <h2 id="t_order_h"></h2>
    <label id="t_email"></label>
    <input id="email" type="email" />
    <label id="t_item"></label>
    <input id="item" type="text" />
    <label id="t_note"></label>
    <textarea id="note"></textarea>
    <div class="row">
      <button class="act b1" type="button" onclick="mailOrder()" id="t_btn_mail"></button>
      <a class="btn b3" href="https://t.me/GsmmeroPTY" target="_blank" id="t_btn_tg"></a>
    </div>
    <p id="msg" class="note" style="margin-top:10px"></p>
  </div>
  <div class="card">
    <h2 id="t_how_h"></h2>
    <ol id="t_how"></ol>
  </div>
  <div class="foot">
    <a href="https://www.youtube.com/@GsmmeroPTY">youtube.com/@GsmmeroPTY</a><br>
    <a href="https://t.me/GsmmeroPTY">t.me/GsmmeroPTY</a> · gsmmeropty@gmail.com
  </div>
</div>
<script>
const T = {
  en: {
    name:"English", dir:"ltr",
    sub:"YouTube repair files · International · No account",
    files_h:"Files from the videos", files_p:"Watch the video, then order here. After Binance Pay I send the file to your email.", files_n:"First pack coming soon. You can already write which video you need.",
    pay_h:"Pay with Binance", pay_box:"<b>Binance Pay</b><br>Pay ID / email: <b>gsmmeropty@gmail.com</b><br>Network: Binance Pay or USDT (ask on Telegram before sending).<br>Then send the payment screenshot on Telegram.",
    order_h:"Order by email or contact me", email:"Your email", item:"Which video / file", note:"Note", btn_mail:"Send order email", btn_tg:"Telegram @GsmmeroPTY",
    how_h:"How it works", how:["No website account.","Email or Telegram.","Pay with Binance Pay.","I share Google Drive only to your email."],
    need:"Need a valid email.", sent:"Email window opened. If not, write Telegram @GsmmeroPTY."
  },
  zh: {
    name:"中文", dir:"ltr",
    sub:"YouTube 维修文件 · 国际 · 无需注册",
    files_h:"视频配套文件", files_p:"看完视频在这里下单。Binance Pay 到账后，文件发到你的邮箱。", files_n:"第一个资料包即将上架，也可先写你要哪一集。",
    pay_h:"用 Binance 付款", pay_box:"<b>Binance Pay</b><br>收款：<b>gsmmeropty@gmail.com</b><br>用 Binance Pay 或 USDT（转账前先在 Telegram 确认）。<br>付完把截图发到 Telegram。",
    order_h:"邮箱下单或直接联系", email:"你的邮箱", item:"视频 / 文件名", note:"备注", btn_mail:"发送订单邮件", btn_tg:"Telegram @GsmmeroPTY",
    how_h:"流程", how:["不用注册网站账号。","邮箱或 Telegram。","Binance Pay 付款。","Drive 只分享给你的邮箱。"],
    need:"请填写有效邮箱。", sent:"已打开邮件。如果没打开，请用 Telegram @GsmmeroPTY。"
  },
  es: {
    name:"Español", dir:"ltr",
    sub:"Archivos de YouTube · Internacional · Sin cuenta",
    files_h:"Archivos de los videos", files_p:"Mira el video y pide aquí. Después de Binance Pay envío el archivo a tu correo.", files_n:"El primer pack llega pronto. Ya puedes indicar el video.",
    pay_h:"Pagar con Binance", pay_box:"<b>Binance Pay</b><br>ID / correo: <b>gsmmeropty@gmail.com</b><br>Binance Pay o USDT (confirma en Telegram antes de enviar).<br>Luego manda la captura por Telegram.",
    order_h:"Pedir por correo o escríbeme", email:"Tu correo", item:"Video / archivo", note:"Nota", btn_mail:"Enviar pedido por correo", btn_tg:"Telegram @GsmmeroPTY",
    how_h:"Cómo funciona", how:["Sin cuenta en la web.","Correo o Telegram.","Pagas con Binance Pay.","Comparto Drive solo a tu correo."],
    need:"Necesito un correo válido.", sent:"Se abrió el correo. Si no, escribe a Telegram."
  },
  hi: {
    name:"हिन्दी", dir:"ltr",
    sub:"YouTube फ़ाࡰल · अंतरराष्ट्रीय · अकाउंट नहीं",
    files_h:"वीडियो की फ़ाइलें", files_p:"वीडियो देखें, यहाँ ऑर्डर करें। Binance Pay के बाद फ़ाइल ईमेल पर भेजूंगा।", files_n:"पहला पैक जल्द आ रहा है। आप वीडियो का नाम लिख सकते हैं।",
    pay_h:"Binance से भुगतान", pay_box:"<b>Binance Pay</b><br>ईमेल: <b>gsmmeropty@gmail.com</b><br>भेजने से पहले Telegram पर पुष्टि करें।<br>भुगतान के बाद स्क्रीनशॉट Telegram पर भेजें।",
    order_h:"ईमेल या Telegram", email:"आपका ईमेल", item:"वीडियो / फ़ाइल", note:"नोट", btn_mail:"ईमेल भेजें", btn_tg:"Telegram @GsmmeroPTY",
    how_h:"कैसे काम करता है", how:["वेबसाࡰट अकाउंट नहीं।","ईमेल या Telegram।","Binance Pay।","Drive सिर्फ आपके ईमेल पर।"],
    need:"सही ईमेल लिखें।", sent:"ईमेल खुल गया। नहीं खुला तो Telegram लिखें।"
  },
  ar: {
    name:"العربية", dir:"rtl",
    sub:"ملفات الفيديو · دولي · بدون حساب",
    files_h:"ملفات الفيديوهات", files_p:"شاهد الفيديو ثم اطلب هنا. بعد Binance Pay أرسل الملف إلى بريدك.", files_n:"أول حزمة قريبًا. يمكنك كتابة اسم الفيديو الآن.",
    pay_h:"الدفع عبر Binance", pay_box:"<b>Binance Pay</b><br>البريد: <b>gsmmeropty@gmail.com</b><br>أكّد عبر Telegram قبل التحويل.<br>ثم أرسل لقطة الدفع على Telegram.",
    order_h:"طلب بالبريد أو Telegram", email:"بريدك", item:"الفيديو / الملف", note:"ملاحظة", btn_mail:"إرسال الطلب", btn_tg:"Telegram @GsmmeroPTY",
    how_h:"كيف يعمل", how:["بدون حساب.","بريد أو Telegram.","Binance Pay.","مشاركة Drive لبريدك فقط."],
    need:"أدخل بريدًا صحيحًا.", sent:"تفتح البريد. إن لم يفتح، اكتب على Telegram."
  }
};
const ORDER = ["en","zh","es","hi","ar"];
function apply(lang){
  const t=T[lang]||T.en;
  document.documentElement.lang=lang;
  document.documentElement.dir=t.dir;
  localStorage.setItem("gsm_lang",lang);
  document.getElementById("t_sub").textContent=t.sub;
  document.getElementById("t_files_h").textContent=t.files_h;
  document.getElementById("t_files_p").textContent=t.files_p;
  document.getElementById("t_files_n").textContent=t.files_n;
  document.getElementById("t_pay_h").textContent=t.pay_h;
  document.getElementById("t_pay_box").innerHTML=t.pay_box;
  document.getElementById("t_order_h").textContent=t.order_h;
  document.getElementById("t_email").textContent=t.email;
  document.getElementById("t_item").textContent=t.item;
  document.getElementById("t_note").textContent=t.note;
  document.getElementById("t_btn_mail").textContent=t.btn_mail;
  document.getElementById("t_btn_tg").textContent=t.btn_tg;
  document.getElementById("t_how_h").textContent=t.how_h;
  document.getElementById("t_how").innerHTML=t.how.map(x=>"<li>"+x+"</li>").join("");
  document.getElementById("email").placeholder="you@gmail.com";
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
}
function mailOrder(){
  const lang=localStorage.getItem("gsm_lang")||"en";
  const t=T[lang]||T.en;
  const email=document.getElementById("email").value.trim();
  const item=document.getElementById("item").value.trim()||"(no title)";
  const note=document.getElementById("note").value.trim();
  const msg=document.getElementById("msg");
  if(!email || email.indexOf("@")<0){ msg.className="err"; msg.textContent=t.need; return; }
  const body=["New file order","Buyer email: "+email,"File: "+item,"Pay: Binance Pay","Note: "+(note||"-")].join("%0A");
  window.location.href="mailto:gsmmeropty@gmail.com?subject="+encodeURIComponent("GsmmeroPTY order: "+item)+"&body="+body;
  msg.className="ok"; msg.textContent=t.sent;
}
(function(){
  const box=document.getElementById("langs");
  ORDER.forEach(k=>{
    const b=document.createElement("button");
    b.type="button"; b.dataset.lang=k; b.textContent=T[k].name;
    b.onclick=function(){ apply(k); };
    box.appendChild(b);
  });
  const start=localStorage.getItem("gsm_lang") || ((navigator.language||"en").toLowerCase().startsWith("zh")?"zh":(navigator.language||"").startsWith("es")?"es":(navigator.language||"").startsWith("hi")?"hi":(navigator.language||"").startsWith("ar")?"ar":"en");
  apply(start);
})();
</script>
</body>
</html>
